name: swift_cloud_backup
description: A simple Flutter backup system app.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  google_fonts: ^5.0.0
  http: ^1.2.2
  file_picker: ^10.3.2
  shared_preferences: ^2.3.2
  logger: ^2.5.0
  flutter_local_notifications: ^17.2.1
  data_table_2: ^2.5.12
  archive: ^3.3.6
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true