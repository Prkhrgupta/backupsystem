name: swift_cloud_backup
description: A simple Flutter backup system app.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  google_fonts: ^6.3.1
  http: ^1.2.2
  file_picker: ^10.3.2
  shared_preferences: ^2.3.2
  logger: ^2.5.0
  flutter_local_notifications: ^19.4.1
  archive: ^4.0.7
  intl: ^0.20.2
  win_toast: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true